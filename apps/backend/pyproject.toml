[project]
name = "clipforge-backend"
version = "0.1.0"
description = "ClipForge - API + Worker: long-form video to vertical short clips"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.36",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "celery[redis]>=5.5",
    "redis>=5.2",
    "structlog>=25.1",
    "python-dotenv>=1.0",
    "yt-dlp>=2025.1.15",
    "faster-whisper>=1.1",
    "httpx>=0.28",
    "openai>=1.60",
    "anthropic>=0.40",
    # Encuadre inteligente: solo se usa el detector de caras Haar, que viene
    # dentro del propio wheel. La 5.x dejo de incluir las cascadas, asi que
    # subir de version obligaria a descargar los modelos aparte.
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Librerías CUDA para la GPU. Van aparte porque pesan ~1,3 GB y una
# instalación solo-CPU no las necesita. cuBLAS 12.8+ es imprescindible para
# Blackwell (RTX 50xx, sm_120).
gpu = [
    "nvidia-cublas-cu12>=12.8",
    "nvidia-cudnn-cu12>=9.0",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-yt-dlp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI Depends() en defaults es idiomatico

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["clipforge"]
strict = true
warn_return_any = true
disallow_untyped_decorators = false
# redis expone py.typed pero deja helpers como `from_url` sin anotar.
untyped_calls_exclude = ["redis"]

[[tool.mypy.overrides]]
# Ninguno de estos publica stubs ni marcador py.typed.
module = ["celery.*", "faster_whisper.*", "ctranslate2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
